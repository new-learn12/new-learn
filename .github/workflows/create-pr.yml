name: Create PR from Copilot Branch

on:
  push:
    branches:
      - 'copilot/**'
  workflow_dispatch:
      inputs:
        branch_to_pr:
          description: 'PR을 생성할 copilot/ 브랜치 이름을 입력하세요'
          required: true
          default: 'copilot/'

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pull-request:
    # 봇이 스스로 만든 커밋에는 반응하지 않도록 방어 로직 추가
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Pull Request
        uses: repo-sync/pull-request@v2
        with:
          source_branch: "${{ github.event.inputs.branch_name }}"
          destination_branch: "main"               # 메인 브랜치로 머지 요청
          pr_title: "🤖 [Draft] Copilot: ${{ github.ref_name }}"
          pr_body: |
            ## 🤖 Copilot 자동 생성 PR
            이 PR은 `copilot/` 브랜치에서 자동으로 생성되었습니다.
            - **수정자:** @${{ github.actor }}
            
            > **안내:** 동료분들을 위해 Draft(초안) 상태로 생성했습니다. 
            > 검토 후 준비가 되었다면 `Ready for review`를 눌러주세요! 😊
          
          github_token: ${{ secrets.GITHUB_TOKEN }} # 권한 설정 확인 필요!
          update_existing: true
          pr_draft: true
          labels: "copilot, auto-pr"